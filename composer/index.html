<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>mooboard composer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%2377edd7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../previewer/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="composer" id="composer">
  <header class="bar">
    <h1>mooboard composer</h1>
    <div class="actions">
      <button type="button" id="undo" disabled>Undo</button>
      <button type="button" id="redo" disabled>Redo</button>
      <label class="button"><input type="file" id="open" accept=".zip,application/zip">Open</label>
      <button type="button" id="export">Export</button>
      <button type="button" id="package">Package</button>
      <button type="button" id="play" class="main" aria-pressed="false">Play</button>
    </div>
  </header>

  <div class="view">
    <div class="stage" id="stage">
      <div class="board" id="board" tabindex="0" role="application" aria-label="Board">
        <canvas class="leds" id="leds"></canvas>
        <canvas class="glow" id="glow" aria-hidden="true"></canvas>
        <div class="ring"></div>
        <div class="chosen" id="chosen" hidden></div>
      </div>
    </div>
    <fieldset class="when" aria-label="Time of day">
      <label><input type="radio" name="when" id="day" checked>Day</label>
      <label><input type="radio" name="when" id="evening">Evening</label>
      <label><input type="radio" name="when" id="night">Night</label>
    </fieldset>
    <ul class="warnings" id="warnings" role="status" aria-live="polite"></ul>
  </div>

  <section class="panel add" aria-labelledby="add-title">
    <h2 id="add-title">Elements</h2>
    <div class="palette" id="palette">
      <button type="button" data-add="text">Text</button>
      <button type="button" data-add="sprite">Sprite</button>
      <button type="button" data-add="picture">Picture</button>
      <button type="button" data-add="box">Box</button>
      <button type="button" data-add="line">Line</button>
      <button type="button" data-add="pixels">Pixels</button>
      <button type="button" data-add="time">Time</button>
      <button type="button" data-add="ticker">Ticker</button>
    </div>
    <input type="file" id="picture" accept="image/png" hidden>
  </section>

  <section class="frames" aria-labelledby="frames-title">
    <h2 id="frames-title">Frames</h2>
    <ol class="strip" id="strip"></ol>
    <div class="row">
      <button type="button" id="frame-add">Add</button>
      <button type="button" id="frame-copy">Copy</button>
      <button type="button" id="frame-delete">Delete</button>
      <button type="button" id="frame-earlier">Earlier</button>
      <button type="button" id="frame-later">Later</button>
    </div>
  </section>

  <section class="panel layers" aria-labelledby="layers-title">
    <h2 id="layers-title">Layers</h2>
    <ul class="list" id="layers"></ul>
  </section>

  <div class="right">
    <aside class="panel sheet" id="sheet" aria-labelledby="sheet-title" hidden>
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button type="button" id="done">Done</button>
      </div>
      <div class="fields" id="fields"></div>
      <div class="row">
        <button type="button" id="up">Up</button>
        <button type="button" id="down">Down</button>
        <button type="button" id="remove">Delete</button>
      </div>
    </aside>
    <section class="panel" aria-labelledby="app-title">
      <h2 id="app-title">App</h2>
      <div class="fields">
        <label class="field"><span>Name</span><input id="app-name" maxlength="24" autocomplete="off"></label>
        <label class="field"><span>ID</span><input id="app-id" maxlength="32" autocomplete="off" spellcheck="false"></label>
        <label class="field"><span>Author</span><input id="app-author" maxlength="39" autocomplete="off" spellcheck="false"></label>
        <label class="field"><span>Refresh in seconds</span><input id="app-refresh" type="number" min="300" max="86400" step="1"></label>
        <label class="field"><span>Duration in seconds</span><input id="app-duration" type="number" min="5" max="60" step="1"></label>
      </div>
      <p class="line" id="app-line" role="status"></p>
      <h3>Settings</h3>
      <ul class="list settings" id="settings"></ul>
      <div class="row">
        <button type="button" data-setting="text">Text</button>
        <button type="button" data-setting="color">Color</button>
        <button type="button" data-setting="toggle">Toggle</button>
        <button type="button" data-setting="choice">Choice</button>
      </div>
      <p class="line" id="settings-line" role="status"></p>
    </section>
  </div>
</main>
<script src="../previewer/previewer.js"></script>
<script src="../mooboard/player/player.js"></script>
<script src="data.js"></script>
<script src="helper.js"></script>
<script src="app.js"></script>
<script src="composer.js"></script>
</body>
</html>
