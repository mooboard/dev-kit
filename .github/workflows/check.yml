name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_clean.py
  readme:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_readme.py
      - run: python3 tools/check_live.py
