<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>mooboard previewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%2377edd7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1 class="brand"><svg class="cow" viewBox="0 0 136 108" aria-hidden="true" focusable="false"><defs><pattern id="cowDim" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" r="1.2" fill="#1F2E38"/><circle cx="2" cy="4" r="1.2" fill="#1F2E38"/></pattern><pattern id="cowLit" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" r="1.75" fill="#FFF"/><circle cx="2" cy="4" r="1.75" fill="#FFF"/></pattern><pattern id="cowPink" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" r="1.75" fill="#FFB7C9"/><circle cx="2" cy="4" r="1.75" fill="#FFB7C9"/></pattern></defs><rect x="41" y="4" width="11" height="24" rx="5.5" fill="#F5E9D6"/><rect x="84" y="4" width="11" height="24" rx="5.5" fill="#F5E9D6"/><ellipse cx="20" cy="45" rx="19" ry="10" fill="#77EDD7"/><ellipse cx="18" cy="45" rx="10" ry="4.6" fill="#FFB7C9"/><ellipse cx="116" cy="45" rx="19" ry="10" fill="#77EDD7"/><ellipse cx="118" cy="45" rx="10" ry="4.6" fill="#FFB7C9"/><rect x="18" y="20" width="100" height="84" rx="30" fill="#77EDD7"/><rect x="31" y="33" width="74" height="58" rx="17" fill="#0E1A22"/><path d="M40 34h56v4h4v4h4v40h-4v4h-4v4H40v-4h-4v-4h-4V42h4v-4h4z" fill="url(#cowDim)"/><path d="M44 42h12v4h4v12h-4v4H44v-4h-4V46h4zm0 4v12h12V46zM80 42h12v4h4v12h-4v4H80v-4h-4V46h4zm0 4v12h12V46z" fill="url(#cowLit)" fill-rule="evenodd"/><path d="M52 70h32v4h4v4h-4v8H52v-8h-4v-4h4zm4 4v4h4v-4zm20 0v4h4v-4z" fill="url(#cowPink)" fill-rule="evenodd"/><circle cx="58" cy="76" r="1.75" fill="#0E1A22"/><circle cx="78" cy="76" r="1.75" fill="#0E1A22"/><rect x="44" y="46" width="12" height="12" fill="#0E1A22"/><rect x="80" y="46" width="12" height="12" fill="#0E1A22"/></svg><span class="mark">mooboard</span> <span class="page">previewer</span></h1>
  <label class="drop" id="drop">
    <input type="file" id="pick" accept="image/png,image/gif,.mooboard">
    <span>Drop a PNG, GIF or .mooboard file here or pick one</span>
  </label>
  <div class="stage" id="stage">
    <div class="board" id="board" hidden>
      <canvas class="leds" id="leds"></canvas>
      <canvas class="glow" id="glow" aria-hidden="true"></canvas>
      <div class="ring" id="ring" hidden></div>
    </div>
  </div>
  <div class="toggles">
    <label class="toggle"><input type="checkbox" id="night">Night</label>
    <fieldset class="toggle">
      <legend>Brightness</legend>
      <label><input type="radio" name="brightness" id="low">Low</label>
      <label><input type="radio" name="brightness" id="high" checked>High</label>
    </fieldset>
    <label class="toggle"><input type="checkbox" id="ringToggle">Padding ring</label>
  </div>
  <ul class="warnings" id="warnings" role="status" aria-live="polite"></ul>

  <div class="home" id="home" hidden>
    <div class="apps" id="apps"></div>
    <p class="apps-sub">Apps</p>
    <div class="apps" id="storeApps">
      <div class="app-cell"><span class="app-icon app-icon--add"><span class="app-icon__box"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span><span class="app-icon__name">Add</span></span></div>
    </div>
    <div id="devRow">
      <p class="apps-sub">Developer apps</p>
      <div class="apps" id="devApps"></div>
    </div>

    <div id="faceRow" hidden>
      <p class="apps-sub">Clock faces</p>
      <div class="faces" id="faceCards"></div>
    </div>
  </div>


  <section class="app-page" id="appPage" hidden>
    <div class="app-page__head">
      <button class="back" type="button" id="back" aria-label="Back to Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Home</span></button>
      <h2 class="app-page__title" id="appTitle"></h2>
    </div>

    <div class="card" id="devCard">
      <div class="card__body card__body--first">
        <div class="field field--inline" inert>
          <span class="field__label" id="rotationLabel">Show in the rotation</span>
          <label class="switch"><input type="checkbox" id="rotation" role="switch" aria-labelledby="rotationLabel" checked><span></span></label>
        </div>
        <div id="settingsFields"></div>
      </div>
      <div class="card__foot card__foot--end" id="saveRow" inert>
        <button class="btn" type="button" id="save"><svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h10l4 4v10a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2zM8 4v5h7V4M8 20v-6h8v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Save</span></button>
      </div>
    </div>

    <div class="card" id="storeCard" inert hidden>
      <h2><span id="storeTitle"></span><label class="switch push"><input type="checkbox" id="storeOn" role="switch" aria-labelledby="storeTitle" checked><span></span></label></h2>
    </div>
    <div class="card__foot card__foot--end store-remove" inert>
      <button class="btn btn--danger" type="button" id="remove"><svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg><span>Remove app</span></button>
    </div>
  </section>

  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="faceSheet" role="dialog" aria-modal="true" aria-labelledby="faceTitle" hidden>
    <div class="card">
      <h2 id="faceTitle"></h2>
      <div class="card__body" id="faceFields"></div>
      <div class="card__foot card__foot--end">
        <button class="btn" type="button" id="faceSave"><svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h10l4 4v10a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2zM8 4v5h7V4M8 20v-6h8v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Save</span></button>
      </div>
    </div>
  </div>
</main>
<script src="previewer.js"></script>
</body>
</html>
